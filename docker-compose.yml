services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: media_pipeline
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env before starting Docker Compose}
    ports: ["3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/media_pipeline
    depends_on:
      mysql: { condition: service_healthy }

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/media_pipeline
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads

    ports: ["8000:8000"]
    volumes:
      - uploads_data:/data/uploads

    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build: .
    command: rq worker media-processing --url redis://redis:6379/0
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/media_pipeline
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads

    volumes:
      - uploads_data:/data/uploads

    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

volumes:
  mysql_data:
  uploads_data:
